name: Upstream Workflow

on:
    schedule:
      - cron: '0 0 */2 * *'
    workflow_dispatch:

jobs:
    sync:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
                
            - name: Add upstream remote
              run: git remote add upstream https://github.com/ortus-boxlang/boxlang-lsp.git

            - name: Fetch upstream
              run: git fetch upstream

            - name: Merge upstream changes
              run: |
                git switch main
                git merge upstream/main

            - name: Push updated main to origin
              run: git push origin main

            - name: Push feature branch
              run: git push origin issue1fix

    
